name: Postman (API) CI
on:
  push:
    branches: [ "main", "GithubActionsCICD" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ls -R
      - run: rm -rf ~/.postman
      - run: npm install -g newman@6
      - run: |
          curl -s -H "X-Api-Key: ${{ secrets.POSTMAN_API_KEY }}" \
            "https://api.getpostman.com/collections/41801404-dc6ad15b-1840-4570-8a9c-55693b6f4f02" \
            -o collection.json
      - run: npm install -g wait-on
      - run: npm install -g nx
      - run: cd frontend & npx nx serve backend &
      - run: npx wait-on --timeout 120000 http://localhost:3000
      - run: npm run start & 
      - run: newman run collection.json

